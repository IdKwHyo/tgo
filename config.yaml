catboost_min_test_projects: 10
lstm_min_observations: 60
lstm_lookback: 6
baseline_min_observations: 8
minimum_relative_improvement: 0.05
stale_after_days: 90
gemini_model: gemini-3.8-flash
retrieval_top_k: 8
