[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tgo-carbon-insurance"
version = "0.1.0"
description = "Evidence-constrained TGO absorption-credit insurance research"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<4", "numpy>=1.26,<3", "scipy>=1.15,<2",
  "scikit-learn>=1.4,<2", "catboost>=1.2.7,<2", "torch>=2.5,<3",
  "google-genai>=1.0,<3", "faiss-cpu>=1.9,<2", "httpx[socks]>=0.28,<1",
  "beautifulsoup4>=4.12,<5", "pyarrow>=18,<30", "pydantic>=2.9,<3",
  "pypdf>=5,<7", "PyYAML>=6,<7", "joblib>=1.4,<2"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
carbon-insurance = "carbon_insurance.cli:main"

[tool.setuptools.packages.find]
include = ["carbon_insurance*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
